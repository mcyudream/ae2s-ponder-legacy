pluginManagement {
    repositories {
        maven { url = 'https://maven.cleanroommc.com' }
        gradlePluginPortal()
    }
}
plugins { id 'com.cleanroommc.cleanroomgradle.settings' version '0.22.0' }
rootProject.name = 'ae2s-ponder-legacy'
include ':ponder'
project(':ponder').projectDir = file('../ponder/build.gradle').exists() ? file('../ponder') : file('.legacy-deps/ponder')
